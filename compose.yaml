name: heysaz-erp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heysaz
      POSTGRES_USER: heysaz          # owner; Flyway runs as this role
      POSTGRES_PASSWORD: heysaz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heysaz -d heysaz"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
