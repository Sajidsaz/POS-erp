# Pinned so every invocation gets a reusable daemon rather than forking a single-use one.
#
# preferIPv4Stack is not cosmetic on Windows: where `localhost` resolves to ::1 but the
# Gradle daemon binds on the IPv4 loopback, the client cannot reach it and the build dies
# with "Unable to establish loopback connection". Forcing one stack removes the mismatch.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
